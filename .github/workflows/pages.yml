name: Test and publish Morris
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morris-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser and real WebRTC regression tests (isolated signaling)
        run: python tests/browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          if-no-files-found: ignore
  online-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Shipped PeerJS and public connection services
        run: python tests/browser_test.py --public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, online-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.legacy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Read existing publishing mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "build_type=$(gh api repos/$GITHUB_REPOSITORY/pages --jq .build_type)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.build_type == 'workflow'
      - name: Stage only public site assets
        run: |
          mkdir _site
          cp index.html styles.css .nojekyll LICENSE _site/
          cp -r src _site/
          printf '%s\n' "$GITHUB_SHA" > _site/version.txt
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.build_type == 'workflow'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.mode.outputs.build_type == 'workflow'
      - name: Publish tested main through the existing gh-pages source
        id: legacy
        if: steps.mode.outputs.build_type == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-pages.sh
